global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  # Self Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # System Performance Monitoring (Saturation, Latency, Traffic, Errors For OS/Host)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Container Performance Monitoring (CPU, Memory, Network Saturation/Traffic)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Placeholder For Backend Application Metrics
  - job_name: 'backend-service'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend-app:8000'] # Change to actual backend host and port
    # Handle Case Where Application Is Not Running Yet During Stack Initialization
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance


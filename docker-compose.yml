services:
  # Section: Metrics System (Prometheus)
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.53.0}
    container_name: lemma-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitor-net
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE}'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'


  # Section: Logs System (Loki)
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.0.0}
    container_name: lemma-loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitor-net
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml


  # Section: Unified Log Collector (Grafana Alloy)
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.18.0}
    container_name: lemma-alloy
    user: root
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitor-net
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "12345:12345" # Alloy UI
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:12345/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # Section: Host Metrics Exporter
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.8.2}
    container_name: lemma-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitor-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'


  # Section: Container Metrics Exporter
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-v0.49.1}
    container_name: lemma-cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitor-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  # Section: Visualization (Grafana)
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.1.0}
    container_name: lemma-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitor-net
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,yesoreyeram-infinity-datasource,marcusolsson-dynamictext-panel
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Section: Image Rendering Service (Grafana Image Renderer)
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: lemma-renderer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitor-net
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8081
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      grafana:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Section: Distributed Tracing System (Tempo)
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.5.0}
    container_name: lemma-tempo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitor-net
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitor-net:
    name: lemma_observability_network
    driver: bridge

volumes:
  prometheus-data:
    name: lemma_prometheus_data
  loki-data:
    name: lemma_loki_data
  alloy-data:
    name: lemma_alloy_data
  grafana-data:
    name: lemma_grafana_data
  tempo-data:
    name: lemma_tempo_data
